<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный учебник</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="textbook-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="animated-background">
        <div class="particles-container" id="particles"></div>
        <div class="floating-elements">
            <div class="floating-element el-1">🏛</div>
            <div class="floating-element el-2">📜</div>
            <div class="floating-element el-3">👑</div>
        </div>
        <div class="gradient-overlay"></div>
    </div>

    <header>
        <div class="header-content">
            <div class="logo" onclick="window.location.href='index.html'">
                <div class="logo-icon">📜</div>
                <div class="logo-text">
                    <h1>Электронный учебник</h1>
                    <p>11 класс - История</p>
                </div>
            </div>
            
            <div class="header-buttons">
                <div class="textbook-btn active">
                    <div class="textbook-icon">📚</div>
                </div>
                <div class="class-wheel-btn" onclick="showClassSelector()">
                    <div class="wheel-icon">🎡</div>
                </div>
            </div>

            <nav class="luxury-nav">
                <a href="index.html" class="nav-item">Главная</a>
                <a href="quiz.html" class="nav-item">Викторины</a>
                <a href="leaders.html" class="nav-item">Таблица лидеров</a>
                <a href="textbook.html" class="nav-item active">Учебник</a>
                <a href="admin.html" class="nav-item">Админ</a>
            </nav>
        </div>
    </header>

    <main class="textbook-container">
        <div class="textbook-sidebar">
            <div class="textbook-search">
                <input type="text" id="textbook-search" placeholder="🔍 Поиск по материалам...">
            </div>
            
            <div class="chapters-list" id="materials-list">
                <!-- Динамически загружается из Supabase -->
            </div>
        </div>

        <div class="textbook-content">
            <div id="no-materials" style="display:none; text-align:center; padding:6rem 2rem;">
                <h2>📄</h2>
                <p>Материалы ещё не добавлены.</p>
                <p style="color:#aaa; margin-top:1rem;">Учитель добавит их через админ-панель</p>
            </div>

            <div id="materials-container" class="materials-grid">
                <!-- Карточки материалов загружаются сюда -->
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-main">
                <div class="footer-brand">
                    <div class="footer-logo">📚</div>
                    <div class="footer-brand-text">
                        <h3>Электронный учебник</h3>
                        <p>11 класс — История</p>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <div class="footer-info">
                    <p>&copy; 2025 Электронный учебник. Все права защищены.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Модальные окна класса и колеса -->
    <div id="class-selector-modal" class="modal">...</div>
    <div id="wheel-modal" class="modal">...</div>

    <script src="config.js"></script>
    <script src="textbook.js"></script>
    <script src="wheel.js"></script>
</body>
</html>
