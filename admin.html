<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- PIN ЭКРАН -->
    <div id="pin-screen" class="pin-screen active">
        <div class="pin-box">
            <h2>Введите PIN-код</h2>
            <div class="pin-dots" id="pin-dots">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="pin-keypad">
                <button onclick="enterPin(1)">1</button>
                <button onclick="enterPin(2)">2</button>
                <button onclick="enterPin(3)">3</button>
                <button onclick="enterPin(4)">4</button>
                <button onclick="enterPin(5)">5</button>
                <button onclick="enterPin(6)">6</button>
                <button onclick="enterPin(7)">7</button>
                <button onclick="enterPin(8)">8</button>
                <button onclick="enterPin(9)">9</button>
                <button onclick="clearPin()" class="btn-delete">⌫</button>
                <button onclick="enterPin(0)">0</button>
                <button onclick="submitPin()" class="btn-confirm">✓</button>
            </div>
        </div>
    </div>

    <!-- АДМИН ПАНЕЛЬ -->
    <div id="admin-main" class="admin-main hidden">
        <div class="admin-sidebar">
            <div class="admin-logo">🛠 АДМИН</div>
            <button onclick="showAdminTab(5)" class="admin-tab active">📚 Учебник</button>
            <button onclick="showAdminTab(6)" class="admin-tab">🏆 Лидеры</button>
        </div>

        <div class="admin-content">
            <!-- ВКладка 5: Учебник -->
            <div id="admin-tab-5" class="admin-tab-content active">
                <h2>📚 Управление учебником</h2>
                
                <div class="form-section">
                    <h3>Добавить материал</h3>
                    <div class="form-row">
                        <input type="text" id="material-title" placeholder="Название материала (например: § 1. XIX век)">
                        <input type="text" id="material-url" placeholder="Ссылка на PDF (https://...)">
                        <button onclick="addMaterial()" class="btn-add">+ Добавить</button>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Добавленные материалы</h3>
                    <div id="admin-materials-list" class="admin-list">
                        <!-- Материалы загружаются здесь -->
                    </div>
                </div>
            </div>

            <!-- Вкладка 6: Лидеры -->
            <div id="admin-tab-6" class="admin-tab-content">
                <h2>🏆 Управление результатами</h2>
                
                <button onclick="clearAllResults()" class="btn-danger">🗑 Очистить все результаты</button>

                <div class="form-section">
                    <h3>Все результаты</h3>
                    <div id="admin-results-list" class="admin-list">
                        <!-- Результаты загружаются здесь -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
