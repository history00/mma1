<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-container">
        <!-- Экран ввода PIN -->
        <div id="pin-screen" class="screen active">
            <div class="pin-container">
                <h2>Введите PIN-код</h2>
                <div class="pin-dots" id="pin-dots">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="pin-keypad">
                    <button onclick="enterPin(1)">1</button>
                    <button onclick="enterPin(2)">2</button>
                    <button onclick="enterPin(3)">3</button>
                    <button onclick="enterPin(4)">4</button>
                    <button onclick="enterPin(5)">5</button>
                    <button onclick="enterPin(6)">6</button>
                    <button onclick="enterPin(7)">7</button>
                    <button onclick="enterPin(8)">8</button>
                    <button onclick="enterPin(9)">9</button>
                    <button onclick="clearPin()" class="delete-btn">⌫</button>
                    <button onclick="enterPin(0)">0</button>
                    <button onclick="submitPin()" class="confirm-btn">✓</button>
                </div>
            </div>
        </div>

        <!-- Основная админ-панель -->
        <div id="admin-panel" class="screen">
            <div class="admin-sidebar">
                <div class="admin-logo">🛠 Админ</div>
                <div class="admin-menu">
                    <button onclick="showTab(1)" class="active">📝 Викторины</button>
                    <button onclick="showTab(2)">✏️ Редактировать</button>
                    <button onclick="showTab(3)">👥 Ученики</button>
                    <button onclick="showTab(4)">🎡 Очередь колеса</button>
                    <button onclick="showTab(5)">📚 Учебник</button>
                    <button onclick="showTab(6)">🏆 Лидеры</button>
                    <button onclick="showTab(7)">🗄 SQL</button>
                </div>
            </div>

            <div class="admin-content">
                <!-- Вкладка 1: Викторины -->
                <div id="tab-1" class="tab-content active">
                    <h2>Управление викторинами</h2>
                    <!-- Форма добавления -->
                    <div class="form-group">
                        <input type="text" id="new-quiz-title" placeholder="Название викторины">
                        <input type="text" id="new-quiz-desc" placeholder="Краткое описание">
                        <input type="text" id="new-quiz-img" placeholder="Ссылка на обложку">
                        <input type="number" id="new-quiz-order" placeholder="Порядок" value="1">
                        <textarea id="new-quiz-questions" rows="12" placeholder="Вставьте вопросы в текстовом формате..."></textarea>
                        <button onclick="createQuiz()" class="btn-primary">Сохранить викторину</button>
                    </div>
                </div>

                <!-- Вкладка 5: Учебник -->
                <div id="tab-5" class="tab-content">
                    <h2>Управление материалами учебника</h2>
                    <div class="form-group">
                        <input type="text" id="new-material-title" placeholder="Название материала">
                        <input type="text" id="new-material-url" placeholder="Ссылка на PDF">
                        <button onclick="addTextbookMaterial()" class="btn-primary">+ Добавить</button>
                    </div>
                    <div id="textbook-materials-list"></div>
                </div>

                <!-- Вкладка 6: Лидеры -->
                <div id="tab-6" class="tab-content">
                    <h2>Результаты всех викторин</h2>
                    <button onclick="clearAllResultsAdmin()" class="btn-danger">🗑 Очистить все результаты</button>
                    <div id="all-results-list"></div>
                </div>

                <!-- Вкладка 7: SQL -->
                <div id="tab-7" class="tab-content">
                    <h2>SQL скрипт создания таблиц</h2>
                    <pre id="sql-script"></pre>
                    <button onclick="copySQL()">📋 Скопировать SQL</button>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
